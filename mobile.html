<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#991b1b">
  <title>Scanner Tamu BBC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 480px; margin: auto; background: #f8fafc; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #991b1b; font-size: 1.25rem; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; box-sizing: border-box; text-decoration: none; }
    .btn-primary { background: #b91c1c; color: white; }
    .btn-secondary { background: #1e293b; color: white; }
    .btn-outline { background: #f1f5f9; color: #1e293b; border: 1.5px solid #cbd5e1; }
    .btn-camera { background: #0284c7; color: white; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-group .btn { margin-top: 0; flex: 1; padding: 12px 8px; font-size: 14px; }
    select, input[type="file"].standard-input { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; background: #fff; }
    #preview { width: 100%; margin-top: 12px; border-radius: 8px; display: none; border: 1px solid #cbd5e1; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; color: #0f172a; }
  </style>
</head>
<body>

  <!-- FITUR 1: SCAN TABEL DAFTAR TAMU -->
  <div class="card">
    <h2>📷 Scan Tabel Daftar Tamu</h2>
    <p style="font-size: 14px; color: #475569;">Ambil foto langsung menggunakan kamera atau pilih dari galeri. Tulisan yang kurang jelas otomatis ditandai untuk dicek di laptop.</p>
    
    <!-- Input tersembunyi khusus Kamera & Galeri -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleTableImage(event)">
    <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleTableImage(event)">

    <!-- Dua Tombol Terpisah -->
    <div class="btn-group">
      <button type="button" class="btn btn-camera" onclick="document.getElementById('cameraInput').click()">📸 Buka Kamera</button>
      <button type="button" class="btn btn-outline" onclick="document.getElementById('galleryInput').click()">🖼️ Pilih Galeri</button>
    </div>

    <img id="preview">
    <button class="btn btn-primary" onclick="uploadTableScan()">Proses & Kirim ke Spreadsheet</button>
    <div id="status"></div>
  </div>

  <!-- FITUR 2: UPLOAD BUKTI FOLLOW UP DARI HP -->
  <div class="card">
    <h2>📎 Lampirkan Bukti Follow-Up</h2>
    <label style="font-size: 14px;">Pilih Nama Tamu:</label>
    <select id="guestSelect"><option>Memuat daftar tamu...</option></select>
    
    <input type="file" id="proofInput" accept="image/*" class="standard-input" style="margin-top: 12px;">
    <button class="btn btn-secondary" onclick="uploadProofHP()">Upload Screenshot WA</button>
    <div id="proofStatus" style="margin-top:10px; font-weight:bold; text-align:center;"></div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx6cygu4XWLXlqUkJSYoDT-a7P4y7YTIy9ndlKyiFDCVotnn7RxDe29NDbfKGgMhkdc/exec";
  let selectedTableFile = null; // Menyimpan file baik dari kamera maupun galeri

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW gagal:', err));
  }

  async function loadGuestList() {
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      const select = document.getElementById("guestSelect");
      select.innerHTML = '<option value="">-- Pilih Tamu --</option>';
      json.data.reverse().forEach(row => {
        const opt = document.createElement("option");
        opt.value = JSON.stringify({ rowIndex: row.rowIndex, nama: row.Nama });
        opt.textContent = `${row.Nama} (${row.Tanggal})`;
        select.appendChild(opt);
      });
    } catch (e) {
      document.getElementById("guestSelect").innerHTML = '<option>Belum ada data / Gagal memuat</option>';
    }
  }

  window.onload = loadGuestList;

  function handleTableImage(event) {
    const file = event.target.files[0];
    if (file) {
      selectedTableFile = file;
      const img = document.getElementById("preview");
      img.src = URL.createObjectURL(file);
      img.style.display = "block";
      document.getElementById("status").innerText = "";
    }
  }

  function compressImage(file, maxWidth = 1600, quality = 0.8) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve(dataUrl.split(",")[1]);
        };
      };
    });
  }

  async function uploadTableScan() {
    const status = document.getElementById("status");
    if (!selectedTableFile) return alert("Ambil foto lewat kamera atau pilih dari galeri terlebih dahulu!");

    status.innerText = "⏳ Mengompresi & membaca tulisan tangan...";
    const base64 = await compressImage(selectedTableFile);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "scan_table", imageBase64: base64 })
      });
      const result = await res.json();
      if (result.status === "success") {
        status.innerText = `✅ Berhasil! ${result.count} baris masuk ke Spreadsheet.`;
        selectedTableFile = null;
        document.getElementById("cameraInput").value = "";
        document.getElementById("galleryInput").value = "";
        document.getElementById("preview").style.display = "none";
        loadGuestList();
      } else {
        status.innerText = "❌ Gagal: " + result.message;
      }
    } catch (err) {
      status.innerText = "❌ Error koneksi: " + err;
    }
  }

  async function uploadProofHP() {
    const selectVal = document.getElementById("guestSelect").value;
    const fileInput = document.getElementById("proofInput");
    const status = document.getElementById("proofStatus");

    if (!selectVal || !fileInput.files[0]) return alert("Pilih tamu dan gambar bukti!");
    const guest = JSON.parse(selectVal);

    status.innerText = "⏳ Mengunggah bukti ke Google Drive...";
    const base64 = await compressImage(fileInput.files[0], 1200, 0.75);

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "upload_proof",
        rowIndex: guest.rowIndex,
        guestName: guest.nama,
        imageBase64: base64
      })
    });
    const result = await res.json();
    if (result.status === "success") {
      status.innerText = "✅ Bukti tersimpan & terhubung ke Spreadsheet!";
      fileInput.value = "";
    }
  }
</script>
</body>
</html>
